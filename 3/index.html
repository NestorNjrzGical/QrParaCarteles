<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terreno Vista Verde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/page.css" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../index.html">Volver al catalogo</a>

      <section class="hero">
        <img
          src="https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1400&q=80"
          alt="Terreno en zona residencial"
        />
        <div class="content">
          <h1>Terreno Vista Verde</h1>
          <p>
            Lote ideal para vivienda o inversion en zona de alto crecimiento.
          </p>

          <div class="grid">
            <div class="item">
              <strong>Superficie</strong>
              420 m2 con frente de 14 metros.
            </div>
            <div class="item">
              <strong>Servicios</strong>
              Agua, luz, alcantarillado y acceso pavimentado.
            </div>
            <div class="item">
              <strong>Precio</strong>
              USD 39,900 negociable.
            </div>
          </div>

          <button
            id="ctaButton"
            class="cta"
            data-message="Excelente. Agenda una visita para conocer el terreno."
          >
            Agendar visita
          </button>
          <p id="note" class="note" hidden></p>
        </div>
      </section>
    </main>

    <script src="../assets/page.js"></script>
  </body>
</html>
