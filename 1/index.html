<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafeteria Aurora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/page.css" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../index.html">Volver al catalogo</a>

      <section class="hero">
        <img
          src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1400&q=80"
          alt="Cafeteria con granos de cafe y bebida"
        />
        <div class="content">
          <h1>Cafeteria Aurora</h1>
          <p>
            Un espacio para brunch, cafe de especialidad y postres artesanales.
          </p>

          <div class="grid">
            <div class="item">
              <strong>Especialidad</strong>
              Cappuccino, cold brew y filtrados.
            </div>
            <div class="item">
              <strong>Horario</strong>
              Lunes a domingo, 7:30 AM - 9:00 PM.
            </div>
            <div class="item">
              <strong>Ubicacion</strong>
              Av. Central 142, Zona Norte.
            </div>
          </div>

          <button
            id="ctaButton"
            class="cta"
            data-message="Perfecto. Te esperamos hoy en Cafeteria Aurora."
          >
            Reservar una mesa
          </button>
          <p id="note" class="note" hidden></p>
        </div>
      </section>
    </main>

    <script src="../assets/page.js"></script>
  </body>
</html>
