<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferreteria El Tornillo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/page.css" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../index.html">Volver al catalogo</a>

      <section class="hero">
        <img
          src="./images/ferreteria.jpg"
          alt="Herramientas de ferreteria sobre una mesa"
        />
        <div class="content">
          <h1>Ferreteria El Tornillo</h1>
          <p>
            Soluciones para hogar y obra con asesoramiento tecnico en cada compra.
          </p>

          <div class="grid">
            <div class="item">
              <strong>Productos</strong>
              Herramientas manuales, electricas y tornilleria.
            </div>
            <div class="item">
              <strong>Servicios</strong>
              Corte de materiales y mezclado de pintura.
            </div>
            <div class="item">
              <strong>Contacto</strong>
              WhatsApp: +00 000 000 000.
            </div>
          </div>

          <button
            id="ctaButton"
            class="cta"
            data-message="Gracias. Te enviaremos una cotizacion en minutos."
          >
            Solicitar cotizacion
          </button>
          <p id="note" class="note" hidden></p>
        </div>
      </section>
    </main>

    <script src="./assets/page.js"></script>
  </body>
</html>
