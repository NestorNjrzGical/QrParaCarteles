<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5c4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8a89f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1400" height="1000" fill="url(#bg)"/>
  
  <!-- Herramientas decorativas -->
  <g id="tools">
    <!-- Llave inglesa grande -->
    <g transform="translate(200, 200)">
      <rect x="20" y="80" width="15" height="200" rx="7" fill="#8B4513"/>
      <circle cx="27.5" cy="90" r="35" fill="none" stroke="#8B4513" stroke-width="8"/>
      <rect x="15" y="270" width="25" height="60" rx="3" fill="#A0522D"/>
    </g>
    
    <!-- Martillo -->
    <g transform="translate(700, 150)">
      <rect x="15" y="100" width="10" height="250" rx="5" fill="#654321"/>
      <rect x="5" y="80" width="40" height="35" rx="8" fill="#3a3a3a"/>
      <circle cx="25" cy="97" r="8" fill="#555"/>
    </g>
    
    <!-- Destornillador -->
    <g transform="translate(1100, 250)">
      <rect x="18" y="120" width="8" height="220" rx="4" fill="#8B6914"/>
      <polygon points="22,80 28,80 32,120 12,120" fill="#C41E3A"/>
      <circle cx="22" cy="130" r="3" fill="#555"/>
    </g>
    
    <!-- Tuerca y tornillo -->
    <g transform="translate(400, 700)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#696969" stroke-width="6"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#696969" stroke-width="4"/>
    </g>
    
    <!-- Llave Phillips -->
    <g transform="translate(1200, 650)">
      <rect x="16" y="100" width="8" height="200" rx="4" fill="#A9A9A9"/>
      <line x1="12" y1="120" x2="28" y2="120" stroke="#696969" stroke-width="6"/>
      <line x1="20" y1="110" x2="20" y2="130" stroke="#696969" stroke-width="6"/>
    </g>
    
    <!-- Tornillos dispersos -->
    <circle cx="300" cy="900" r="6" fill="#808080"/>
    <circle cx="450" cy="850" r="5" fill="#808080"/>
    <circle cx="600" cy="920" r="6" fill="#808080"/>
    <circle cx="1050" cy="870" r="5" fill="#808080"/>
  </g>
  
  <!-- Texto centrado -->
  <text x="700" y="950" font-size="48" font-weight="bold" text-anchor="middle" fill="#3a3a3a" font-family="Arial">Ferreteria - Herramientas y Materiales</text>
</svg>